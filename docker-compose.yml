# ClawGuard — local infra (Redis + Anvil). Run Python services on host: `make api`
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
