[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../config" }]

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../config" }]

[profile.ci.fuzz]
# CI runs a larger fuzz budget to catch edge cases we'd miss on a dev loop.
runs = 1024

[profile.ci.invariant]
runs = 128
depth = 256

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 128

[rpc_endpoints]
local = "http://localhost:8545"
