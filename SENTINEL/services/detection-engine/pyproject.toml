[tool.poetry]
name = "sentinel-detection-engine"
version = "0.2.0"
description = "Pattern detection over mempool events. Phase 2 implementation."
authors = ["SENTINEL engineering"]
license = "MIT"
packages = [{ include = "detection_engine", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
web3 = "6.15.1"
redis = { extras = ["hiredis"], version = "5.0.2" }
pydantic = "2.6.3"
orjson = "3.9.15"
structlog = "24.1.0"
eth-utils = "4.1.1"
aiohttp = "^3.9.0"
prometheus_client = "^0.20.0"
scikit-learn = ">=1.4.0"
numpy = ">=1.26.0"
torch = {version = ">=2.0.0", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-asyncio = "0.23.5"
pytest-cov = "4.1.0"
ruff = "0.3.0"
mypy = "1.8.0"

[tool.pytest.ini_options]
addopts = "-p no:ethereum"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/__main__.py"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
