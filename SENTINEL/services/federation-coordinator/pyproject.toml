[tool.poetry]
name = "sentinel-federation-coordinator"
version = "0.1.0"
description = "K-of-N verdict aggregator across N independent detection operators."
authors = ["SENTINEL engineering"]
license = "MIT"
packages = [{ include = "federation_coordinator", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
redis = { extras = ["hiredis"], version = "5.0.2" }
aiohttp = "^3.9.0"
structlog = "24.1.0"
prometheus_client = "^0.20.0"
orjson = "3.9.15"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-asyncio = "0.23.5"
pytest-cov = "4.1.0"
ruff = "0.3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/__main__.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
