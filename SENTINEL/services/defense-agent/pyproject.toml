[tool.poetry]
name = "sentinel-defense-agent"
version = "0.2.0"
description = "Policy-bounded defense agent. Builds, proves, submits tx. Phase 2 implementation."
authors = ["SENTINEL engineering"]
license = "MIT"
packages = [{ include = "defense_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
web3 = "6.15.1"
redis = { extras = ["hiredis"], version = "5.0.2" }
pydantic = "2.6.3"
orjson = "3.9.15"
structlog = "24.1.0"
eth-account = "0.11.0"
eth-abi = "5.0.1"
eth-utils = "4.1.1"
httpx = "^0.27.0"
aiohttp = "^3.9.0"
prometheus_client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.2"
pytest-asyncio = "0.23.5"
pytest-cov = "4.1.0"
ruff = "0.3.0"
mypy = "1.8.0"

[tool.pytest.ini_options]
addopts = "-p no:ethereum"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["*/__main__.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
