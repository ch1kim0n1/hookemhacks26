# Redis Sentinel configuration for SENTINEL v2 HA production profile.
# Mounted read-only at /etc/redis/sentinel.conf by docker-compose.
# Monitors redis-master (port 6379) with quorum=2 across 3 sentinel instances.

port 26379
bind 0.0.0.0
protected-mode no

# Where to persist sentinel's own state (required for crash recovery).
dir /tmp

# The master to watch. Quorum=2 means 2 of 3 sentinels must agree before failover.
sentinel monitor mymaster redis-master 6379 2

# Mark master DOWN after 5s of unreachability.
sentinel down-after-milliseconds mymaster 5000

# Abort failover if it hasn't succeeded within 10s.
sentinel failover-timeout mymaster 10000

# During failover, only one replica reconfigures at a time (bounded sync storm).
sentinel parallel-syncs mymaster 1

# Deny unsafe runtime reconfiguration from the sentinel REPL.
sentinel deny-scripts-reconfig yes

# Resolve hostnames (replicas are docker-compose service names).
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
