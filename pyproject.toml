[project]
name = "clawguard"
version = "0.1.0"
description = "Security middleware for OpenClaw agents — defends against prompt injection across modalities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.26",
]

[project.optional-dependencies]
ml = ["transformers>=4.45.0", "torch>=2.0.0"]
chain = ["web3>=7.0.0"]
ocr = ["pytesseract>=0.3.10"]
audio = ["openai-whisper>=20231117"]
pdf-gen = ["reportlab>=4.0.0"]
demo = ["alpaca-py>=0.43.2"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.8.0", "bandit>=1.8.0"]
local = ["transformers>=4.45.0", "torch>=2.0.0", "web3>=7.0.0", "pytesseract>=0.3.10", "python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only ship the `skill` package; the repo has other top-level dirs that must not be installed.
[tool.setuptools.packages.find]
where = ["."]
include = ["skill*", "learning*", "network*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["skill/tests", "learning/tests", "network/tests", "tests/contracts"]
