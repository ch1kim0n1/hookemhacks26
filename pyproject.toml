[project]
name = "clawguard"
version = "0.1.0"
description = "Security middleware for OpenClaw agents — defends against prompt injection across modalities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ml = ["transformers>=4.45.0", "torch>=2.0.0"]
chain = ["web3>=7.0.0"]
ocr = ["pytesseract>=0.3.10"]
audio = ["openai-whisper>=20231117"]
pdf-gen = ["reportlab>=4.0.0"]
demo = ["alpaca-py>=0.31.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]
local = ["transformers>=4.45.0", "torch>=2.0.0", "web3>=7.0.0", "pytesseract>=0.3.10", "python-dotenv>=1.0.0"]
# SENTINEL-hoisted stack: detection-engine, defense-agent, mempool, redis bus, learning loop
sentinel = [
    "web3>=6.15.0,<8",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.6.0",
    "orjson>=3.9.0",
    "structlog>=24.0.0",
    "eth-utils>=4.0.0",
    "eth-account>=0.11.0",
    "eth-abi>=5.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "prometheus-client>=0.20.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["detector/tests_on_chain", "blockchain/tests", "learning/tests"]
asyncio_mode = "auto"

# [build-system] removed to prevent Vercel from trying to build the package
# For local dev: uv pip install -e ".[local]"
