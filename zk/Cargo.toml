[workspace]
members = [
    "guest/scan-attestation",
    "guest/defense-update-correctness",
    "host",
    "shared",
]
resolver = "2"

[workspace.dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.133"
sha2 = { version = "0.10.8", default-features = false }
hex = "0.4.3"
anyhow = "1.0.93"

[profile.release]
opt-level = 3
lto = "thin"
