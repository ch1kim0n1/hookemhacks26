[package]
name = "clawguard-zk-host"
version = "0.4.0-clawguard"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "prove_scan"
path = "src/bin/prove_scan.rs"

[[bin]]
name = "prove_defense_update"
path = "src/bin/prove_defense_update.rs"

[[bin]]
name = "dump_image_ids"
path = "src/bin/dump_image_ids.rs"

[dependencies]
risc0-zkvm = { workspace = true, features = ["std", "client"] }
risc0-ethereum-contracts = { version = "=3.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
hex = { workspace = true }
anyhow = { workspace = true }
sentinel-zk-shared = { path = "../shared" }

[build-dependencies]
risc0-build = "=3.0.5"

[package.metadata.risc0]
methods = [
    "../guest/scan-attestation",
    "../guest/defense-update-correctness",
]
